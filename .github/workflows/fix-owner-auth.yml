name: Fix Owner Auth Callback
on:
  push:
    paths:
      - .github/workflows/fix-owner-auth.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix async callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old="function handlePdkAuthUser(user){"
          new="async function handlePdkAuthUser(user){"
          if old in s:
              p.write_text(s.replace(old,new,1))
          else:
              print("Target already fixed or not present")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Owner Google auth callback async"
          git push
